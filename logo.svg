<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B0"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA7C1E"/>
      <stop offset="100%" stop-color="#E6C26D"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Brain Jewel Gradients -->
    <linearGradient id="tealGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="purpleGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="cyanGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON GROUP (Brain + Solar Crest) -->
  <g transform="translate(10, 10)">
    <!-- Solar Halo Glow -->
    <circle cx="50" cy="50" r="46" fill="url(#goldGlow)" filter="url(#subtleGlow)" opacity="0.3"/>

    <!-- Solar Rays (The "Anshu" - Radiant Sun Rays) -->
    <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="88" y1="50" x2="102" y2="50"/>
      <line x1="83" y1="28" x2="94" y2="20"/>
      <line x1="72" y1="12" x2="80" y2="2"/>
      <line x1="83" y1="72" x2="94" y2="80"/>
      <line x1="72" y1="88" x2="80" y2="98"/>
    </g>

    <!-- Golden Solar Crescent Arc -->
    <path d="M 68 14 A 42 42 0 0 1 88 50 A 42 42 0 0 1 68 86 A 36 36 0 0 0 82 50 A 36 36 0 0 0 68 14 Z" 
          fill="url(#goldGrad)" filter="url(#subtleGlow)"/>

    <!-- Triangular Solar Flare Spikes -->
    <polygon points="88,50 97,46 95,54" fill="url(#goldGrad)"/>
    <polygon points="82,26 91,20 87,29" fill="url(#goldGrad)"/>
    <polygon points="82,74 87,71 91,80" fill="url(#goldGrad)"/>
    <polygon points="70,12 76,4 72,15" fill="url(#goldGrad)"/>
    <polygon points="70,88 72,85 76,96" fill="url(#goldGrad)"/>

    <!-- Faceted Geometric Neural Brain -->
    <!-- Front Lobe -->
    <polygon points="26,38 38,24 50,30 38,44" fill="url(#tealGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="38,24 54,20 62,30 50,30" fill="url(#cyanGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="54,20 68,26 62,30" fill="url(#goldFacet)" stroke="#042F2E" stroke-width="0.8"/>

    <!-- Mid Brain & Core -->
    <polygon points="26,38 38,44 32,58 20,50" fill="url(#purpleGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="38,44 52,42 48,56 32,58" fill="url(#tealGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="52,42 66,38 68,52 48,56" fill="url(#cyanGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="62,30 68,26 74,38 66,38" fill="url(#goldFacet)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="66,38 74,38 76,54 68,52" fill="url(#purpleGem)" stroke="#042F2E" stroke-width="0.8"/>

    <!-- Lower Lobe & Stem -->
    <polygon points="20,50 32,58 30,72 18,64" fill="url(#cyanGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="32,58 48,56 46,72 30,72" fill="url(#goldFacet)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="48,56 68,52 64,68 46,72" fill="url(#tealGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="68,52 76,54 70,68 64,68" fill="url(#cyanGem)" stroke="#042F2E" stroke-width="0.8"/>

    <!-- Cerebellum / Stem Base -->
    <polygon points="30,72 46,72 42,82 34,80" fill="url(#purpleGem)" stroke="#042F2E" stroke-width="0.8"/>
    <polygon points="46,72 58,70 52,82 42,82" fill="url(#tealGem)" stroke="#042F2E" stroke-width="0.8"/>

    <!-- Neural Constellation Sparkles / Synaptic Nodes -->
    <circle cx="38" cy="24" r="2" fill="#FFFFFF" filter="url(#subtleGlow)"/>
    <circle cx="50" cy="30" r="1.8" fill="#FDE68A"/>
    <circle cx="48" cy="56" r="2.2" fill="#FFFFFF" filter="url(#subtleGlow)"/>
    <circle cx="68" cy="52" r="1.8" fill="#5EEAD4"/>
    <circle cx="32" cy="58" r="1.6" fill="#FDE68A"/>
    <circle cx="46" cy="72" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK: AnshuAI -->
  <g transform="translate(130, 72)">
    <!-- "Anshu" in Clean Executive Sans-Serif -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="44" 
          letter-spacing="-0.5" 
          fill="#FFFFFF">Anshu</text>
    
    <!-- "AI" highlighted in Radiant Gold with Gradient -->
    <text x="140" y="0" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="44" 
          letter-spacing="-0.5" 
          fill="url(#goldGrad)">AI</text>

    <!-- Tagline: INTELLIGENCE ILLUMINATED -->
    <text x="3" y="24" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="600" 
          font-size="11" 
          letter-spacing="5.5" 
          fill="#C5A059" 
          opacity="0.95">INTELLIGENCE ILLUMINATED</text>
  </g>
</svg>
