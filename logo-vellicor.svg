<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vVelocitySilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="vCoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7C1E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <filter id="vSubtleCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- EMBLEM GROUP (Velocity Blades + Anchored Core) -->
  <g transform="translate(10, 5)">
    <polygon points="16,18 33,18 48,72 38,81" fill="url(#vVelocitySilver)"/>
    <polygon points="84,18 67,18 52,72 62,81" fill="url(#vVelocitySilver)"/>
    <polygon points="50,91 38,81 62,81" fill="url(#vCoreGold)"/>

    <g filter="url(#vSubtleCoreGlow)">
      <polygon points="50,29 64,48 50,67 36,48" fill="url(#vCoreGold)"/>
      <polygon points="50,37 57,48 50,59 43,48" fill="#041619"/>
      <circle cx="50" cy="48" r="2.2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- WORDMARK: VELLICOR TECHNOLOGIES -->
  <g transform="translate(125, 66)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="42" 
          letter-spacing="1.5" 
          fill="#FFFFFF">VELLICOR</text>
    
    <text x="235" y="-1" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="500" 
          font-size="24" 
          letter-spacing="2" 
          fill="url(#vCoreGold)">TECHNOLOGIES</text>

    <!-- Tagline: Velocity & Core -->
    <text x="3" y="24" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="600" 
          font-size="10.5" 
          letter-spacing="5" 
          fill="#94A3B8">VELOCITY &bull; CORE &bull; TRANSFORMATION</text>
  </g>
</svg>
