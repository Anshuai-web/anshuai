<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Left Pillar: Kinetic Teal Gradient -->
    <linearGradient id="apexTeal" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#093B38"/>
      <stop offset="30%" stop-color="#0F766E"/>
      <stop offset="70%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <!-- Right Pillar: Solar Gold Gradient -->
    <linearGradient id="apexGold" x1="100%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#785918"/>
      <stop offset="30%" stop-color="#9A7B2C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FDF0CD"/>
    </linearGradient>

    <!-- Keystone Diamond Gradient -->
    <linearGradient id="apexKeystone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>

    <!-- Crown Apex Gradient -->
    <linearGradient id="apexCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDF0CD"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Ascending Pillar (Kinetic Intelligence & ServiceNow Rigor) -->
  <polygon points="18,84 34,84 48,26 34,18" fill="url(#apexTeal)"/>
  <!-- Left Inner Bevel Reflection -->
  <polygon points="28,84 34,84 48,26 44,26" fill="#5EEAD4" opacity="0.3"/>

  <!-- Right Ascending Pillar (Solar Growth & Value Realization) -->
  <polygon points="82,84 66,84 52,26 66,18" fill="url(#apexGold)"/>
  <!-- Right Inner Bevel Reflection -->
  <polygon points="72,84 66,84 52,26 56,26" fill="#FFF3D6" opacity="0.35"/>

  <!-- The Apex Crown (Synthesis & Convergence) -->
  <polygon points="34,18 50,7 66,18 50,28" fill="url(#apexCrown)"/>

  <!-- Grounded Architectural Vertex Base -->
  <polygon points="50,91 36,84 64,84" fill="url(#apexGold)"/>

  <!-- Central Floating Keystone (The "A" Bridge & Radiant Nucleus) -->
  <g filter="url(#coreGlow)">
    <!-- Outer Precision Diamond -->
    <polygon points="50,38 65,53 50,68 35,53" fill="url(#apexKeystone)"/>
    
    <!-- Precision Inner Architectural Chamber -->
    <polygon points="50,44 58,53 50,62 42,53" fill="#041619"/>
    
    <!-- The "Anshu" (Center Point of Illumination) -->
    <circle cx="50" cy="53" r="3.2" fill="#FFFFFF"/>
    
    <!-- Optical Flare Axes (Intelligence Illuminated) -->
    <line x1="50" y1="30" x2="50" y2="35" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="50" y1="71" x2="50" y2="76" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="27" y1="53" x2="32" y2="53" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="68" y1="53" x2="73" y2="53" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>