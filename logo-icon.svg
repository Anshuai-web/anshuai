<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Velocity Blades Gradient: Crisp Platinum to Titanium -->
    <linearGradient id="velocitySilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Anchored Core Gradient: Architectural Radiant Gold -->
    <linearGradient id="coreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7C1E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Subtle Depth Filter -->
    <filter id="subtleCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- VELOCITY BLADES (Aerodynamic Kinetic Thrust) -->
  <g>
    <!-- Left Velocity Blade -->
    <polygon points="16,18 33,18 48,72 38,81" fill="url(#velocitySilver)"/>
    
    <!-- Right Velocity Blade -->
    <polygon points="84,18 67,18 52,72 62,81" fill="url(#velocitySilver)"/>
    
    <!-- Kinetic Foundation Vertex -->
    <polygon points="50,91 38,81 62,81" fill="url(#coreGold)"/>
  </g>

  <!-- THE CORE (Anchored Central Keystone: Strength, Governance & Stability) -->
  <g filter="url(#subtleCoreGlow)">
    <!-- Outer Keystone Diamond -->
    <polygon points="50,29 64,48 50,67 36,48" fill="url(#coreGold)"/>
    
    <!-- Inner Architectural Nexus -->
    <polygon points="50,37 57,48 50,59 43,48" fill="#041619"/>
    
    <!-- Core Horizon Spark / Illumination -->
    <circle cx="50" cy="48" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
