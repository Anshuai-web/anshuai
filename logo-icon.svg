<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nexusStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>
    <linearGradient id="nexusOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <filter id="nexusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Primary Orbital Vector (Kinetic Teal) -->
  <ellipse cx="50" cy="50" rx="42" ry="18" transform="rotate(-30 50 50)" stroke="url(#nexusOrbit)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Secondary Orbital Trajectory -->
  <ellipse cx="50" cy="50" rx="42" ry="18" transform="rotate(30 50 50)" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10 5" opacity="0.6"/>
  <!-- 8-Point Diamond Star ("Anshu" Sunburst) -->
  <g filter="url(#nexusGlow)">
    <polygon points="50,16 55,42 78,35 59,50 78,65 55,58 50,84 45,58 22,65 41,50 22,35 45,42" fill="url(#nexusStar)"/>
    <circle cx="50" cy="50" r="5.5" fill="#041619"/>
    <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Orbital Planetary Nodes -->
  <circle cx="82" cy="32" r="3.2" fill="#5EEAD4"/>
  <circle cx="18" cy="68" r="2.8" fill="#D4AF37"/>
</svg>