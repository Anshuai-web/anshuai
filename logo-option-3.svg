<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C1E"/>
    </linearGradient>
    <linearGradient id="opt3Orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- MARK: THE ORBITAL VELOCITY CORE -->
  <g transform="translate(10, 5)">
    <!-- Primary Orbital Ellipse (Tilted 35 deg, Velocity Trajectory) -->
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(-30 50 50)" stroke="url(#opt3Orbit)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Secondary Counter Orbital Ellipse (Tilted +35 deg, Dynamic Symmetry) -->
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(30 50 50)" stroke="url(#opt3Orbit)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>

    <!-- THE CORE: Solid Anchored Diamond Keystone Nucleus -->
    <polygon points="50,30 65,50 50,70 35,50" fill="url(#opt3Gold)"/>
    <!-- Inner Radiant Spark -->
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>
    
    <!-- Velocity Nodes on Trajectory -->
    <circle cx="78" cy="34" r="2.5" fill="#FFFFFF"/>
    <circle cx="22" cy="66" r="2" fill="#D4AF37"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(125, 66)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="40" letter-spacing="1.5" fill="#FFFFFF">VELLICOR</text>
    <text x="228" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="24" letter-spacing="2" fill="url(#opt3Gold)">TECHNOLOGIES</text>
    <text x="3" y="24" font-family="'Outfit', sans-serif" font-weight="600" font-size="10.5" letter-spacing="5" fill="#94A3B8">OPTION 3 &bull; THE ORBITAL VELOCITY CORE</text>
  </g>
</svg>
