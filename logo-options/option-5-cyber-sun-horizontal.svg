<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wordmarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON -->
  <g transform="translate(10, 10)">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="o5Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6"/><stop offset="40%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#785918"/>
    </linearGradient>
    <linearGradient id="o5Teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/><stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="o5Glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#o5Glow)">
    <circle cx="50" cy="50" r="16" fill="url(#o5Gold)"/>
    <circle cx="50" cy="50" r="7" fill="#041619"/>
    <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
  </g>
  <rect x="47.5" y="10" width="5" height="18" rx="2.5" fill="url(#o5Gold)"/>
  <rect x="47.5" y="72" width="5" height="18" rx="2.5" fill="url(#o5Gold)"/>
  <rect x="10" y="47.5" width="18" height="5" rx="2.5" fill="url(#o5Teal)"/>
  <rect x="72" y="47.5" width="18" height="5" rx="2.5" fill="url(#o5Teal)"/>
  <rect x="48" y="16" width="4" height="14" rx="2" fill="#D4AF37" transform="rotate(45 50 50)"/>
  <rect x="48" y="70" width="4" height="14" rx="2" fill="#D4AF37" transform="rotate(45 50 50)"/>
  <rect x="48" y="16" width="4" height="14" rx="2" fill="#2DD4BF" transform="rotate(-45 50 50)"/>
  <rect x="48" y="70" width="4" height="14" rx="2" fill="#2DD4BF" transform="rotate(-45 50 50)"/>
</svg>
  </g>

  <!-- WORDMARK TYPOGRAPHY -->
  <g transform="translate(130, 72)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="44" 
          letter-spacing="-0.5" 
          fill="#FFFFFF">Anshu</text>
    <text x="140" y="0" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="44" 
          letter-spacing="-0.5" 
          fill="url(#wordmarkGold)">AI</text>
    <text x="3" y="24" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="600" 
          font-size="11" 
          letter-spacing="5.5" 
          fill="#D4AF37" 
          opacity="0.95">INTELLIGENCE ILLUMINATED</text>
  </g>
</svg>