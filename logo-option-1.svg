<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opt1Blade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="opt1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>
  </defs>

  <!-- MARK: THE KINETIC KEYSTONE -->
  <g transform="translate(10, 5)">
    <!-- Aerodynamic Left Blade -->
    <polygon points="16,18 34,18 48,72 37,82" fill="url(#opt1Blade)"/>
    <!-- Aerodynamic Right Blade -->
    <polygon points="84,18 66,18 52,72 63,82" fill="url(#opt1Blade)"/>
    <!-- Grounded Base Vertex -->
    <polygon points="50,92 37,82 63,82" fill="url(#opt1Gold)"/>

    <!-- Central Anchored Keystone -->
    <polygon points="50,28 64,48 50,68 36,48" fill="url(#opt1Gold)"/>
    <!-- Inner Core Aperture -->
    <polygon points="50,36 58,48 50,60 42,48" fill="#030A0D"/>
    <!-- Illumination Point -->
    <circle cx="50" cy="48" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(125, 66)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="40" letter-spacing="1.5" fill="#FFFFFF">VELLICOR</text>
    <text x="228" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="24" letter-spacing="2" fill="url(#opt1Gold)">TECHNOLOGIES</text>
    <text x="3" y="24" font-family="'Outfit', sans-serif" font-weight="600" font-size="10.5" letter-spacing="5" fill="#94A3B8">OPTION 1 &bull; THE KINETIC KEYSTONE</text>
  </g>
</svg>
